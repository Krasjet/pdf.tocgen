[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf.tocgen"
dynamic = ["version"]
description = "Automatically generate table of contents for pdf files"
requires-python = ">=3.7"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["pdf", "cli"]
authors = [{ name = "krasjet" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop"
]

dependencies = [
  "PyMuPDF>=1.18.14",
  "toml>=0.10.2",
  "chardet>=5.1.0",
]

[project.optional-dependencies]
dev = [
  "mamba>=0.11.1",
  "jedi>=0.17.2",
  "pylint>=2.5.3",
]

[tool.hatch.version]
path = "pdftocgen/__init__.py"

[project.urls]
Homepage = "https://krasjet.com/voice/pdf.tocgen/"
Source = "https://github.com/Krasjet/pdf.tocgen"

[project.scripts]
pdfxmeta = "pdfxmeta.app:main"
pdftocgen = "pdftocgen.app:main"
pdftocio = "pdftocio.app:main"

[tool.hatch.build.targets.wheel]
packages = [
  "pdfxmeta",
  "pdftocgen",
  "pdftocio",
  "fitzutils"
]

[tool.hatch.build.targets.sdist]
include = [
  "pdfxmeta/",
  "pdftocgen/",
  "pdftocio/",
  "fitzutils/",
  "pyproject.toml",
  "README.md",
  "LICENSE*"
]
